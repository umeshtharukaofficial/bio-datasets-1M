name: Auto Update Bio Datasets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Generate batch
        env:
          BATCH_SIZE: "200"
        run: python scripts/batch_runner.py
        
      - name: Commit & push
        run: |
          git config user.name  "bio-datasets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          TOTAL=$(($(wc -l < manifest/index.csv) - 1))
          git commit -m "chore(data): auto-generate 200 synthetic biology datasets (total: $TOTAL)" || echo "no changes"
          git push
